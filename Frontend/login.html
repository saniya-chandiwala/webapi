<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | THE STORE</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

<script src="js/jquery-3.6.0.js"></script></head>

<body>

    <div id="navbar"></div>

    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h1>WELCOME BACK<span>.</span></h1>
            </div>

            <form id="loginForm" class="auth-form" onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="name@domain.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="auth-submit-btn">
                    SIGN IN <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-switch">
                <span>New to THE STORE?</span>
                <a href="signup.html">Create an Account</a>
            </div>
        </div>
    </main>

    <div id="footer"></div>

  <script src="js/fetchNavAndFooter.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
