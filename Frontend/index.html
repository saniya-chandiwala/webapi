<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE STORE | Pop Culture Costumes</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- jQuery for component injection -->
<script src="js/jquery-3.6.0.js"></script></head>

<body>

    <div id="navbar"></div>

    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-text">
                <span class="hero-tag">NEW COLLECTION</span>
                <h1>WEAR THE MULTIVERSE.</h1>
                <p>Official pop culture streetwear, movie-accurate armor, and statement fits built for the bold.</p>
                <a href="#categories" class="hero-btn">EXPLORE FITS <i class="fa-solid fa-arrow-right"></i></a>
            </div>
            <div class="hero-img">
                <img src="images/front-img.jpg" alt="Hero Costume">
            </div>
        </section>

        <!-- Categories Section -->
        <section id="categories">
            <div class="category-header">
                <h2>SHOP BY CATEGORY</h2>
                <a href="products.html">
                    VIEW ALL <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>

            <div id="categoryCards">
                <!-- Categories will be generated by JavaScript -->
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="js/fetchNavAndFooter.js"></script>

</body>

</html>
